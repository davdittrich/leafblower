name: r-check

on:
  push:
  pull_request:

jobs:
  r-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - uses: r-lib/actions/setup-tinytex@d3c5be51b12e724e68f33216ca3c148b66d5f0b6

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
          install-pandoc: false

      - name: Tarball hygiene guard
        run: |
          set -e
          count="$(git ls-files | grep -Ec '^(cell_table_92c4f45\.(cpp|hpp)|ieppa_92c4f45\.cpp|patch_raking\.py|patch_wolfe\.py|test_output\.log|leafblower_0\.1\.0\.tar\.gz|REVIEW_FINDINGS\.md|code-review-findings\.md|baseline_bench\.R|security-review-2026-04-27-ieppa\.json|leafblower\.Rcheck/)' || true)"
          if [ "$count" != "0" ]; then
            echo "Tarball hygiene guard failed: $count tracked stray file(s) found." >&2
            git ls-files | grep -E '^(cell_table_92c4f45\.(cpp|hpp)|ieppa_92c4f45\.cpp|patch_raking\.py|patch_wolfe\.py|test_output\.log|leafblower_0\.1\.0\.tar\.gz|REVIEW_FINDINGS\.md|code-review-findings\.md|baseline_bench\.R|security-review-2026-04-27-ieppa\.json|leafblower\.Rcheck/)' >&2
            exit 1
          fi

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          args: 'c("--as-cran")'
          error-on: '"warning"'
