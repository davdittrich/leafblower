[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "leafblower"
# Version is hardcoded here and in DESCRIPTION; keep in sync on releases.
# The ../DESCRIPTION relative path is fragile in sdist builds where the
# directory layout differs from a local source tree.
version = "0.1.1"
description = "High-performance survey calibration (ORIS, raking, Sinkhorn, Chebyshev IPM, GREG)"
# python/README.md is a symlink to ../README.md (single source of truth) --
# a real file/symlink here, not a force-include target, because scikit-build-core
# reads `readme` directly off disk at metadata-generation time (editable installs
# included), unlike sdist file selection which force-include governs.
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3"]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
test   = ["pytest"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages    = ["leafblower"]
# xc1s.13(a): the test_*.py files live inside the package dir (so the editable install
# discovers them for pytest), but ship ~2500 LOC of tests in the distributed wheel.
# Exclude them from the wheel artifact only; the editable/source tree keeps them.
wheel.exclude     = ["leafblower/test_*.py"]

# CORE_SOURCES lives at ../src (repo root), outside python/'s project directory --
# scikit-build-core's default sdist walk can never reach outside the project root, so
# `uv build`/`python -m build` (which build the wheel FROM the generated sdist, not the
# live source tree) failed with "Cannot find source file: ../src/c_api.cpp" until this
# was added. force-include vendors ../src's contents under sdist-internal src/; the
# generated/gitignored build artifacts (*.o, *.so, Makevars, lbw_config.h) that live
# alongside the real sources are excluded so the sdist only ships tracked source.
# CMakeLists.txt's LBW_SRC_DIR detects which of the two layouts (../src or src) is
# present and builds from either transparently.
[tool.scikit-build.sdist]
exclude = ["src/*.o", "src/*.so", "src/Makevars", "src/Makevars.bak", "src/lbw_config.h"]

[tool.scikit-build.sdist.force-include]
"../src" = "src"

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux*"
test-command = "python -c \"import leafblower; leafblower.harvest\""

[tool.cibuildwheel.linux]
before-all = """
if command -v yum >/dev/null 2>&1; then
    yum install -y lapack-devel openblas-devel
else
    dnf install -y lapack-devel openblas-devel
fi
"""

[tool.cibuildwheel.macos]
environment = { CMAKE_ARGS = "-DBLA_VENDOR=Apple" }
